# Configuracion de analisis estatico con SonarQube / SonarCloud.
# Responde al feedback: analisis de vulnerabilidades y calidad de codigo,
# con clasificacion por severidad para priorizar refactores.

sonar.projectKey=psdash-modernizado
sonar.projectName=psdash modernizado
sonar.projectVersion=1.0.0

# Codigo fuente a analizar.
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests

# Python.
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml

# Exclusiones: dependencias y artefactos de build.
sonar.exclusions=**/node_modules/**,**/dist/**,**/__pycache__/**,**/*.min.js

# Codificacion.
sonar.sourceEncoding=UTF-8
