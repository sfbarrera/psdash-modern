# Nginx: sirve la SPA y enruta /api al backend.
# Actua como unico punto de entrada (tactica de seguridad).
server {
    listen 80;
    server_name _;

    # Cabeceras de seguridad basicas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Archivos estaticos de la SPA de React.
    root /usr/share/nginx/html;
    index index.html;

    # Enrutamiento SPA: cualquier ruta desconocida sirve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso: /api va al backend FastAPI.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
